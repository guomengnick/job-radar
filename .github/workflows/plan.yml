name: plan

# Shows, on every pull request from this repository, what the change would
# do to the AWS stack: terraform plan with a read-only role, in the run's
# summary. Nothing is changed; the state lock is not taken. The repository
# is public and so are these logs: only the plan's summary line and the
# resource addresses are printed, never the values.

on:
  pull_request:
    paths: ["cmd/**", "internal/**", "config/**", "infra/**", "go.mod", "go.sum", "Makefile"]

permissions:
  contents: read
  id-token: write # the OIDC token AWS trusts

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # A pull request from a fork gets no AWS role (and no secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_telegram_chat_id: ${{ secrets.TF_VAR_TELEGRAM_CHAT_ID }}
      TF_VAR_mail_domain: ${{ secrets.TF_VAR_MAIL_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lambda
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: terraform plan
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=job-radar/terraform.tfstate" -backend-config="region=ap-southeast-2" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform plan -input=false -lock=false -no-color -out=tfplan > plan.txt || { tail -40 plan.txt; exit 1; }
          {
            echo "### terraform plan"
            echo
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo '<details><summary>Resources</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | grep -E '^  # ' || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
