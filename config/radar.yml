# job-radar rules. Embedded into the binary at build time (go:embed), so a rule
# change is a reviewed commit plus a redeploy — see docs/adr/README.md (ADR 8).
# Title keywords mirror career-ops portals.yml title_filter as of 2026-10-11.

title:
  # Lowercased substring match; a 2–3 letter alphabetic keyword matches as a
  # whole word only. "a + b" means both terms must appear. "word:x" matches x as
  # a whole word ("word:intern" skips "Internal"); "stem:x" matches words that
  # start with x ("stem:rust" skips "Trust"). Same syntax as career-ops.
  positive:
    - "Senior Software Engineer"
    - "Senior Software Developer"
    - "Backend Engineer"
    - "Backend Software Engineer"
    - "Backend Developer"
    - "Integration Engineer"
    - "Integration Software Engineer"
    - "API Engineer"
    - "C++"
    - "C#"
    - ".NET"
    - "Python Engineer"
    - "Systems Software Engineer"
    - "Platform Software Engineer"
    - "Infrastructure Software Engineer"
    - "Software Development Engineer"
    - "Embedded Software Engineer"
    - "Camera Software Engineer"
    - "Localization Engineer"
    - "Motion Planning Engineer"
    - "Control Software Engineer"
    - "MES Engineer"
    - "Release Engineer"
    - "Build Engineer"
    - "Developer Productivity Engineer"
    - "Computer Vision Engineer"
    - "Vision Engineer"
    - "ML Vision Engineer"
    - "Perception Engineer"
    - "Robotics Software Engineer"
    - "Algorithm Engineer"
    - "Platform Engineer"
    - "Data Platform"
    - "Data Infrastructure"
    - "Data Engineer"
    - "Data Pipeline"
    - "Ingestion"
    - "Streaming"
    - "Telemetry"
    - "IoT"
    - "IIoT"
    - "Distributed Systems"
    - "Golang"
    - "Go Engineer"
    - "Go Developer"
    - "Go Backend"
    - "Java Engineer"
    - "Java Developer"
    - "Java Backend"
    - "Kotlin"
    - "TypeScript"
    - "Node.js"
    - "NodeJS"
    - "word:rust"
    - "word:scala"
    - "Server Engineer"
    - "Server-side"
    - "Software Engineer II"
    - "Software Engineer III"
    - "Software Engineer 3"
  negative:
    - "Principal"
    - "Director"
    - "Head of"
    - "word:architect"
    - "Full Stack"
    - "Fullstack"
    - "Full-Stack"
    - "Frontend"
    - "Front-end"
    - "Front End"
    - "Mobile"
    - "Junior"
    - "word:intern"
    - "Internship"
    - "iOS"
    - "Android"
    - "Data Scientist"
    - "Data Analyst"
    - "Product Manager"
    - "Project Manager"
    - "Engineering Manager"
    - "Solutions Engineer"
    - "Sales Engineer"
    - "Technical Account"
    - "Customer Engineer"
    - "Forward Deployed"
    - "Field"
    - "Support"
    - "Quality Assurance"
    - "Quality Engineer"
    - "SDET"
    - "in Test"
    - "AI Trainer"
    - "Trainer"
    - "Test Automation"
    - "Entry"
    - "Associate"

location:
  # In-person days per week that are still acceptable (policy 2026-10-04).
  taipei_hybrid_max_days: 2
  hsinchu_hybrid_max_days: 2

# Rough fit score: weights of matched skills in title + JD, capped at 100.
# Any programming language is acceptable (2026-10-11), so a language the user
# does not know is never a penalty — it simply earns nothing here.
skills:
  - { name: "C#", pattern: '(?i)c#', weight: 15 }
  - { name: ".NET", pattern: '(?i)\.net\b', weight: 15 }
  - { name: "C++", pattern: '(?i)c\+\+', weight: 15 }
  - { name: "Python", pattern: '(?i)\bpython\b', weight: 10 }
  - { name: "Kafka", pattern: '(?i)\bkafka\b', weight: 12 }
  - { name: "PostgreSQL", pattern: '(?i)\bpostgres(?:ql)?\b', weight: 10 }
  - { name: "SQL", pattern: '(?i)\bsql\b', weight: 4 }
  - { name: "Data pipeline", pattern: '(?i)data pipelines?|etl\b|ingestion|event[- ]driven|streaming', weight: 10 }
  - { name: "Distributed systems", pattern: '(?i)distributed systems?', weight: 6 }
  - { name: "Backend/API", pattern: '(?i)\bback[- ]?end\b|\bapis?\b|microservices?', weight: 6 }
  - { name: "Industrial/IoT", pattern: '(?i)industrial|manufacturing|factory|\biot\b|iiot|robotic|semiconductor|equipment|telemetry', weight: 10 }
  # Machine data collection, the predictive-maintenance pipeline's front end
  # (RS485 Modbus RTU). Approved 2026-10-18; Chinese terms match 104 postings.
  - { name: "MQTT/IoT data collection", pattern: '(?i)\bmqtt\b|modbus|data acquisition|資料收集|數據收集|資料採集|數據採集', weight: 10 }
  - { name: "Observability", pattern: '(?i)grafana|prometheus|observability|monitoring', weight: 5 }
  - { name: "Parquet/DuckDB", pattern: '(?i)parquet|duckdb', weight: 5 }
  - { name: "Docker", pattern: '(?i)\bdocker\b', weight: 4 }
  - { name: "Reliability", pattern: '(?i)idempoten|outbox|exactly[- ]once|at[- ]least[- ]once|fault[- ]toleran', weight: 6 }
  - { name: "Performance", pattern: '(?i)performance|latency|memory (?:usage|footprint)|profil', weight: 4 }
  - { name: "CI/CD", pattern: '(?i)ci/cd|continuous integration|build pipeline', weight: 3 }
  - { name: "Linux", pattern: '(?i)\blinux\b', weight: 3 }
  - { name: "Computer vision", pattern: '(?i)computer vision|opencv|image processing', weight: 6 }
  # Cloud skills (2026-10-15). AWS scores because radar itself runs on AWS.
  # Terraform and Kubernetes score 0: recorded on each job for the monthly
  # "how many postings ask for this" count, without changing notifications.
  - { name: "AWS", pattern: '(?i)\baws\b|amazon web services', weight: 10 }
  - { name: "Terraform", pattern: '(?i)\bterraform\b', weight: 0 }
  - { name: "Kubernetes", pattern: '(?i)\bkubernetes\b|\bk8s\b', weight: 0 }

# Taichung springboard (master plan §3, category 5): office jobs in Taichung
# from 104 alerts. 104's job categories already narrow them to software, so a
# title is only vetoed by title_exclude; title_plus words rank what remains,
# and words in neither list (演算法, MES, 測試) pass without a bonus. ASCII
# words match whole words, but may touch Chinese ("AI工程師" has "ai").
# Approved by the user 2026-10-18; 行銷, 行政, 人資 and 校園徵才 added 2026-10-20
# after the first real alert; 現場工程師 2026-10-22 (the whole word: 現場 alone
# would drop a remote role that "需不定期現場支援"). The digest lists what these
# drop, so a wrong rule shows.
springboard:
  title_plus: [後端, 全端, 軟體工程師, 資料工程, 數據工程, 平台, 雲端, devops, sre, .net, "c#", python, go, ai, 機器學習, 系統分析, 技術主管, 架構師]
  title_exclude: [plc, 韌體, 電控, 硬體, 機構, 助理, 實習, 工讀, 業務, 儲備幹部, 客服, 講師, 行銷, 行政, 人資, 校園徵才, 現場工程師]
  # "Pay clearly above the current NT$880k", on the top of the posted range:
  # NT$1M a year, or a monthly range reaching NT$70k (1M / 14 months).
  # 面議 only implies NT$40k a month or more, so it is listed as unknown.
  min_annual_salary: 1000000
  min_monthly_top_pay: 70000
  # Tagged, not dropped: the user judges these by hand (2026-10-19). 104
  # cuts descriptions to about 150 characters, so a tag can be missed.
  notes:
    - { name: 替代役, words: [替代役] }
    - { name: 兼職, words: [兼職, 部分工時] }
    - { name: 外包／派遣, words: [外包, 派遣, 駐點, 駐廠] }
    - { name: 顧問, words: [顧問] }

notify:
  # Class A = explicitly open to Taiwan; class B = remote, country not stated.
  class_a_min_score: 40
  class_b_min_score: 60
  max_items: 25

scan:
  # Requests per second per ATS API host, and boards fetched in parallel.
  # 2026-10-11 local test: 900 boards per ATS at 15 rps, 16 in flight →
  # 0 throttled. At 15 rps a full Greenhouse pass (8,334 boards) is ~9 minutes,
  # inside Lambda's 15-minute limit. See docs/adr/README.md (ADR 5).
  rps:
    greenhouse: 15
    lever: 15
    ashby: 15
  concurrency: 16
  dead_after_404: 3
  dead_recheck_days: 7
  # Stop starting new boards this long before the invocation deadline, and
  # cancel fetches still in flight halfway through it, so saving always has time.
  deadline_buffer_seconds: 60

boards:
  # Public slug lists (one JSON array per ATS). Check its license before relying on it.
  dataset_base: "https://raw.githubusercontent.com/Feashliaa/job-board-aggregator/main/data"
  # Boards always tracked, even if missing from the dataset.
  extra:
    greenhouse: [appier, tenstorrent, anthropic, vercel, clickhouse, timescale, redpandadata, scylladb]
    lever: [Gogolook, nahc]
    ashby: [supabase, foxglove, applied]

# 送到雷達: a job page sent from the browser extension is judged by this model
# against the user's private profile (an SSM parameter, not in this repo).
# One call per click; Sonnet for the full-text judgement.
assess:
  model: claude-sonnet-5-5
